<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse</title>
<style>
  :root {
    --bg:#fbfbfa; --panel:#fff; --rail:#f4f4f2; --border:#e4e4e1; --text:#1a1a18;
    --muted:#6e6e68; --accent:#2f6f4f; --accent-soft:#e8f2ec; --bad:#b4342a; --warn:#8a6410;
    --ws:#2f6f4f; --sse:#4a5fa8; --sse-soft:#e9ecf7; --radius:10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#161614; --panel:#1f1f1d; --rail:#1a1a18; --border:#343431; --text:#f0f0ec;
      --muted:#9b9b94; --accent:#6bbd90; --accent-soft:#223029; --bad:#f08076; --warn:#d6aa4a;
      --ws:#6bbd90; --sse:#8fa3e8; --sse-soft:#232838;
    }
  }
  :root[data-theme="dark"] {
    --bg:#161614; --panel:#1f1f1d; --rail:#1a1a18; --border:#343431; --text:#f0f0ec;
    --muted:#9b9b94; --accent:#6bbd90; --accent-soft:#223029; --bad:#f08076; --warn:#d6aa4a;
    --ws:#6bbd90; --sse:#8fa3e8; --sse-soft:#232838;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  button, input { font:inherit; color:inherit; }

  #signin { height:100%; display:grid; place-items:center; padding:24px; }
  .card {
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:28px; width:100%; max-width:380px;
  }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .dot { width:11px; height:11px; border-radius:50%; background:var(--accent); }
  .brand h1 { font-size:21px; margin:0; letter-spacing:-.01em; }
  .card p { color:var(--muted); font-size:14px; margin:0 0 20px; }
  .field { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  .field label { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  input[type=text] { padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:var(--bg); }
  input[type=text]:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  .btn {
    padding:10px 16px; border-radius:8px; border:1px solid var(--accent);
    background:var(--accent); color:#fff; cursor:pointer; font-weight:500;
  }
  .btn:hover { filter:brightness(1.07); }
  .btn.wide { width:100%; }

  #app { display:none; height:100%; grid-template-columns:210px 1fr 290px; }
  @media (max-width:980px) { #app { grid-template-columns:1fr; } #side { display:none; } }
  #rail { background:var(--rail); border-right:1px solid var(--border); padding:16px 12px; overflow-y:auto; }
  #rail .brand { padding:0 6px 14px; }
  .sect { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding:12px 8px 6px; }
  .chan {
    display:flex; align-items:center; gap:8px; width:100%; text-align:left; cursor:pointer;
    padding:7px 8px; border-radius:7px; border:1px solid transparent; background:transparent;
  }
  .chan:hover { background:var(--panel); }
  .chan[aria-current="true"] { background:var(--accent-soft); border-color:var(--accent); }
  .chan .hash { color:var(--muted); }
  .chan .nm { flex:1; }
  .badge {
    min-width:20px; padding:1px 6px; border-radius:10px; background:var(--sse); color:#fff;
    font-size:11px; font-weight:600; text-align:center;
  }
  .badge[hidden] { display:none; }

  main { display:flex; flex-direction:column; min-width:0; }
  header { padding:12px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header h2 { margin:0; font-size:17px; }
  header .topic { color:var(--muted); font-size:13px; flex:1; min-width:120px; }
  .pips { display:flex; gap:14px; font-size:12px; }
  .pip-item { display:flex; align-items:center; gap:6px; color:var(--muted); white-space:nowrap; }
  .pip { width:8px; height:8px; border-radius:50%; background:var(--muted); flex:none; }
  .pip-item.live .pip { background:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .pip-item.dead .pip { background:var(--bad); }
  .pip-item.stale .pip { background:var(--warn); }

  #messages { flex:1; overflow-y:auto; padding:18px 20px; display:flex; flex-direction:column; gap:14px; }
  .msg { display:flex; gap:11px; }
  .av { width:32px; height:32px; border-radius:8px; flex:none; display:grid; place-items:center;
        background:var(--accent-soft); color:var(--accent); font-weight:600; font-size:13px; }
  .msg .who { font-weight:600; font-size:14px; }
  .msg .when { color:var(--muted); font-size:12px; margin-left:7px; font-weight:400; }
  .msg .txt { white-space:pre-wrap; word-break:break-word; }
  .empty { color:var(--muted); text-align:center; margin:auto; font-size:14px; }
  #typing { height:20px; padding:0 20px; color:var(--muted); font-size:12.5px; font-style:italic; }
  form#composer { display:flex; gap:10px; padding:14px 20px 18px; border-top:1px solid var(--border); }
  form#composer input { flex:1; }

  /* right side: live activity, the visible proof that streams are flowing */
  #side { border-left:1px solid var(--border); background:var(--rail); display:flex; flex-direction:column; min-height:0; }
  #side .sect { padding:14px 14px 6px; }
  #people { padding:0 10px 8px; }
  .person { display:flex; align-items:center; gap:8px; padding:5px 4px; font-size:14px; }
  .person .pip { background:var(--muted); }
  .person.on .pip { background:var(--accent); }

  #sync {
    margin:0 14px 10px; padding:8px 10px; border-radius:8px; border:1px solid var(--border);
    background:var(--panel); font-size:12px; color:var(--muted);
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  #sync.stale { border-color:var(--warn); color:var(--warn); }
  #sync.dead  { border-color:var(--bad); color:var(--bad); }
  #sync b { font-variant-numeric:tabular-nums; }

  #activity { flex:1; overflow-y:auto; padding:0 10px 14px; display:flex; flex-direction:column; gap:7px; min-height:0; }
  .ev {
    display:flex; gap:8px; align-items:baseline; font-size:13px; padding:6px 8px;
    border-radius:7px; background:var(--panel); border:1px solid var(--border);
    animation:pop .22s ease-out;
  }
  @keyframes pop { from { opacity:0; transform:translateY(-4px); } }
  .tag {
    font-size:9.5px; font-weight:700; letter-spacing:.05em; padding:2px 5px; border-radius:4px;
    flex:none; margin-top:1px;
  }
  .tag.ws  { background:var(--accent-soft); color:var(--ws); }
  .tag.sse { background:var(--sse-soft); color:var(--sse); }
  .ev .body { flex:1; min-width:0; }
  .ev .t { color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums; flex:none; }
  .ev .detail { color:var(--muted); font-size:12px; }
  #activity .empty-ev { color:var(--muted); font-size:13px; padding:8px; }

  .toast-wrap { position:fixed; right:16px; bottom:16px; display:flex; flex-direction:column; gap:8px; z-index:50; }
  .toast {
    background:var(--panel); border:1px solid var(--border); border-left:3px solid var(--sse);
    border-radius:8px; padding:10px 13px; max-width:300px; box-shadow:0 6px 20px rgba(0,0,0,.14);
    animation:pop .22s ease-out;
  }
  .toast b { font-size:13px; }
  .toast p { margin:2px 0 0; font-size:13px; color:var(--muted); }
  .notice { margin:10px 20px 0; padding:9px 12px; border-radius:8px; font-size:13px;
            border:1px solid var(--warn); color:var(--warn); }
  .notice[hidden] { display:none; }
</style>
</head>
<body>

<section id="signin">
  <div class="card">
    <div class="brand"><span class="dot"></span><h1>Pulse</h1></div>
    <p>Team messaging. Pick a name to join — use another browser or a private window to join as a second person.</p>
    <form id="loginForm">
      <div class="field">
        <label for="name">Display name</label>
        <input id="name" type="text" autocomplete="off" placeholder="e.g. Dhiwakar" required>
      </div>
      <button class="btn wide" type="submit">Join</button>
    </form>
  </div>
</section>

<div id="app">
  <nav id="rail">
    <div class="brand"><span class="dot"></span><h1>Pulse</h1></div>
    <div class="sect">Channels</div>
    <div id="channels"></div>
    <div class="sect">Signed in</div>
    <div style="padding:0 8px;font-size:14px" id="whoami"></div>
  </nav>

  <main>
    <header>
      <h2 id="chanName">#general</h2>
      <span class="topic" id="chanTopic"></span>
      <div class="pips">
        <span class="pip-item" id="pipChat"><span class="pip"></span><span>chat</span></span>
        <span class="pip-item" id="pipFeed"><span class="pip"></span><span>alerts</span></span>
      </div>
    </header>
    <div class="notice" id="notice" hidden></div>
    <div id="messages"></div>
    <div id="typing"></div>
    <form id="composer" autocomplete="off">
      <input id="input" type="text" placeholder="Message #general" required>
      <button class="btn" type="submit">Send</button>
    </form>
  </main>

  <aside id="side">
    <div class="sect">In this workspace</div>
    <div id="people"></div>
    <div class="sect">Live activity</div>
    <div id="sync"><span>Last update</span><b id="syncAge">—</b></div>
    <div id="activity"><div class="empty-ev">Nothing yet. Activity appears here as it streams in.</div></div>
  </aside>
</div>

<div class="toast-wrap" id="toasts"></div>

<script src="app.js"></script>
</body>
</html>
